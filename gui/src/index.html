<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'none';"
    />
    <link rel="icon" type="image/png" href="./praimate.png" />
    <title>PrAImate GUI</title>
    <style>
      body {
        margin: 0;
        background: oklch(1 0 0);
      }
      .dark body {
        background: oklch(0.145 0 0);
      }
      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      .splash-logo {
        width: 90px;
        height: 90px;
        border-radius: 18px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <script>
      try {
        let t = localStorage.getItem("theme");
        if (!t) {
          const legacy = localStorage.getItem("opengui:web:settings:theme");
          if (legacy === "dark" || legacy === "light" || legacy === "system") {
            t = legacy;
            localStorage.setItem("theme", legacy);
          }
        }
        document.documentElement.classList.toggle("dark", t ? t === "dark" : true);
      } catch (_e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <div id="root">
      <div class="splash">
        <img class="splash-logo" src="./praimate.png" alt="PrAImate" />
      </div>
    </div>
    <script type="module" src="./frontend.tsx" async></script>
  </body>
</html>
