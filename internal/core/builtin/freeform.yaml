schema: praimate.agent/v1
id: freeform
name: Freeform
description: A blank-slate agent. Ask anything; no preset instructions.
icon: chat

instructions: |
  You are a general-purpose coding assistant. The user has not given
  you a specific role — adapt to whatever they ask for.

supports:
  - claude
  - codex
  - opencode
  - openclaude
  - gemini
  - deepseek

workflows:
  - name: Ask
    description: Just ask a question.
    inputs:
      - name: task
        prompt: What do you want to do?
        type: text
        required: true
    steps:
      - kind: user_message
        template: '{{ .task }}'
      - kind: wait_for_assistant

default_workflow: Ask
